name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            
            1. Use the repository's CLAUDE.md for guidance on style and conventions. 
            2. Be constructive and helpful in your feedback. 
            3. Add a general review comment with overall thoughts
            4. (Very Important) Add inline comments for specific lines of code that need attention. 
            5. Use `gh pr diff` to examine the changes and identify specific issues
            6. For inline comments on specific lines, use the following command: 
               `gh pr review --comment --body "Your comment here" --commit <commit sha> --path <file path> --line <line number>`. Make sure you specify the line number so it will appear inline.
               Alternatively, you can use:
               `gh api repos/:owner/:repo/pulls/:pr_number/comments \
              -f body='This line could use improvement' \
              -f commit_id=$(gh pr view <PR_NUMBER> --json headRefOid -q .headRefOid) \
              -f path='<file path>' \
              -f line=<line number>
            7. For general feedback, use:  `gh pr comment --body "Your overall review here"`
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr review:*),Bash(gh api :*)"'